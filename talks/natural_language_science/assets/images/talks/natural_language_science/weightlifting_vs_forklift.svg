<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 820" width="560" height="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- An original illustration of the weightlifting vs forklift analogy
       (after Ted Chiang): top, a person lifting a barbell in a gym; bottom,
       a forklift carrying concrete slabs to a building site. -->
  <rect width="560" height="820" fill="white"/>

  <!-- ===== Weightlifting (gym) ===== -->
  <rect x="20" y="20" width="520" height="370" rx="18" fill="#efe9fb" stroke="#7a3fd1" stroke-width="4"/>
  <text x="280" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#202020">Weightlifting</text>
  <text x="280" y="90" text-anchor="middle" font-size="19" fill="#6b6b6b">the effort is the point</text>
  <rect x="40" y="330" width="480" height="40" rx="6" fill="#d8cdee"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- legs (slight squat) -->
    <path d="M262 262 L246 296 L254 332" stroke="#3b4a63" stroke-width="20" fill="none"/>
    <path d="M298 262 L314 296 L306 332" stroke="#3b4a63" stroke-width="20" fill="none"/>
    <ellipse cx="248" cy="336" rx="20" ry="8" fill="#202020"/>
    <ellipse cx="312" cy="336" rx="20" ry="8" fill="#202020"/>
    <!-- torso -->
    <path d="M254 180 Q280 168 306 180 L302 268 L258 268 Z" fill="#7a3fd1"/>
    <!-- arms up holding the bar -->
    <path d="M258 190 L222 160 L210 128" stroke="#e8b98f" stroke-width="16" fill="none"/>
    <path d="M302 190 L338 160 L350 128" stroke="#e8b98f" stroke-width="16" fill="none"/>
    <!-- head -->
    <circle cx="280" cy="152" r="24" fill="#e8b98f"/>
    <path d="M258 146 Q262 124 282 124 Q302 126 302 146 Q290 136 270 140 Z" fill="#4a3324"/>
    <path d="M272 162 L288 162" stroke="#8a4b2d" stroke-width="3"/>
  </g>
  <!-- barbell -->
  <rect x="120" y="120" width="320" height="10" rx="5" fill="#6b6b6b"/>
  <rect x="128" y="94" width="22" height="62" rx="4" fill="#202020"/>
  <rect x="152" y="102" width="16" height="46" rx="4" fill="#3d3d3d"/>
  <rect x="410" y="94" width="22" height="62" rx="4" fill="#202020"/>
  <rect x="392" y="102" width="16" height="46" rx="4" fill="#3d3d3d"/>
  <!-- effort marks -->
  <g stroke="#7a3fd1" stroke-width="3" stroke-linecap="round">
    <path d="M318 150 l14 -6 M320 164 l16 0"/>
    <path d="M242 150 l-14 -6 M240 164 l-16 0"/>
  </g>
  <path d="M310 136 q4 8 0 12 q-4 -4 0 -12 z" fill="#6cb8e8"/>

  <!-- ===== Forklift (building site) ===== -->
  <rect x="20" y="420" width="520" height="380" rx="18" fill="#fdf1e2" stroke="#d9822b" stroke-width="4"/>
  <text x="280" y="462" text-anchor="middle" font-size="28" font-weight="700" fill="#202020">Forklift</text>
  <text x="280" y="490" text-anchor="middle" font-size="19" fill="#6b6b6b">the job needs doing</text>
  <rect x="40" y="740" width="480" height="40" rx="6" fill="#e8d3b4"/>

  <!-- building under construction -->
  <g stroke="#9a9a9a" stroke-width="5" fill="none">
    <rect x="430" y="560" width="80" height="180"/>
    <line x1="430" y1="620" x2="510" y2="620"/>
    <line x1="430" y1="680" x2="510" y2="680"/>
    <line x1="470" y1="560" x2="470" y2="740"/>
  </g>
  <path d="M440 560 L440 520 L520 520" stroke="#d9822b" stroke-width="5" fill="none"/>

  <!-- forklift body -->
  <rect x="150" y="640" width="150" height="70" rx="8" fill="#f2b632" stroke="#c48a10" stroke-width="3"/>
  <path d="M170 640 L180 575 L260 575 L272 640" fill="none" stroke="#3d3d3d" stroke-width="6" stroke-linejoin="round"/>
  <rect x="120" y="650" width="30" height="50" rx="4" fill="#3d3d3d"/>
  <!-- driver -->
  <circle cx="222" cy="610" r="14" fill="#e8b98f"/>
  <path d="M206 608 Q208 590 222 590 Q238 590 238 608 Z" fill="#f2b632"/>
  <!-- mast and forks -->
  <rect x="300" y="545" width="12" height="190" fill="#3d3d3d"/>
  <rect x="312" y="640" width="90" height="8" fill="#3d3d3d"/>
  <rect x="312" y="700" width="90" height="8" fill="#3d3d3d"/>
  <!-- concrete slabs (stack of 10) -->
  <g fill="#bdbdbd" stroke="#8a8a8a" stroke-width="2">
    <rect x="316" y="580" width="84" height="6"/>
    <rect x="316" y="586" width="84" height="6"/>
    <rect x="316" y="592" width="84" height="6"/>
    <rect x="316" y="598" width="84" height="6"/>
    <rect x="316" y="604" width="84" height="6"/>
    <rect x="316" y="610" width="84" height="6"/>
    <rect x="316" y="616" width="84" height="6"/>
    <rect x="316" y="622" width="84" height="6"/>
    <rect x="316" y="628" width="84" height="6"/>
    <rect x="316" y="634" width="84" height="6"/>
  </g>
  <text x="358" y="570" text-anchor="middle" font-size="18" font-weight="700" fill="#202020">10 slabs</text>
  <!-- wheels -->
  <circle cx="185" cy="720" r="22" fill="#202020"/>
  <circle cx="185" cy="720" r="8" fill="#9a9a9a"/>
  <circle cx="275" cy="722" r="18" fill="#202020"/>
  <circle cx="275" cy="722" r="7" fill="#9a9a9a"/>
</svg>
