<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- An original illustration, companion to sculptor_code.svg: a gardener
       watering a flower bed. They do not shape the flower; they prepare the
       soil (labelled with the parts of the engineered loop) and the flower
       grows on its own. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1fb"/>
      <stop offset="1" stop-color="#f6fbf2"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5434"/>
      <stop offset="1" stop-color="#5a3c22"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky, sun, grass -->
  <rect width="640" height="720" fill="url(#sky)"/>
  <circle cx="545" cy="95" r="110" fill="url(#sunglow)"/>
  <circle cx="545" cy="95" r="42" fill="#ffd34d"/>
  <rect y="500" width="640" height="220" fill="#9ccc7a"/>

  <!-- raised bed: soil layers labelled with the loop's ingredients -->
  <rect x="300" y="500" width="300" height="160" rx="6" fill="#a07c52"/>
  <rect x="312" y="512" width="276" height="136" rx="4" fill="url(#soil)"/>
  <g font-size="18" font-weight="700" fill="#f7ead2">
    <text x="330" y="548">🎯 goal</text>
    <text x="330" y="584">✅ correctness test</text>
    <text x="330" y="620">⏱️ timing script</text>
    <text x="472" y="548">📚 wiki</text>
  </g>
  <g stroke="#4a3018" stroke-width="2" opacity="0.6">
    <line x1="318" y1="560" x2="582" y2="560" stroke-dasharray="6 6"/>
    <line x1="318" y1="596" x2="582" y2="596" stroke-dasharray="6 6"/>
  </g>

  <!-- the flower, growing by itself -->
  <path d="M450 512 C445 450 462 400 450 300" stroke="#3f8f3a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M452 440 C490 420 515 430 528 410 C500 400 470 410 452 440 Z" fill="#5fae4f"/>
  <path d="M449 400 C410 385 392 395 376 375 C405 365 435 375 449 400 Z" fill="#5fae4f"/>
  <g transform="translate(450 270)">
    <g fill="#ff7aa8" stroke="#e0507f" stroke-width="2">
      <ellipse cx="0" cy="-44" rx="22" ry="36"/>
      <ellipse cx="0" cy="-44" rx="22" ry="36" transform="rotate(60)"/>
      <ellipse cx="0" cy="-44" rx="22" ry="36" transform="rotate(120)"/>
      <ellipse cx="0" cy="-44" rx="22" ry="36" transform="rotate(180)"/>
      <ellipse cx="0" cy="-44" rx="22" ry="36" transform="rotate(240)"/>
      <ellipse cx="0" cy="-44" rx="22" ry="36" transform="rotate(300)"/>
    </g>
    <circle r="28" fill="#ffd34d" stroke="#e0a800" stroke-width="2"/>
    <text y="7" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#202020">10×</text>
  </g>
  <!-- sparkles -->
  <g stroke="#e0a800" stroke-width="3" stroke-linecap="round">
    <path d="M540 220 l0 18 M531 229 l18 0"/>
    <path d="M360 230 l0 14 M353 237 l14 0"/>
    <path d="M525 330 l0 12 M519 336 l12 0"/>
  </g>

  <!-- gardener -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M140 470 L125 600" stroke="#4d6b3a" stroke-width="26" fill="none"/>
    <path d="M180 470 L200 600" stroke="#4d6b3a" stroke-width="26" fill="none"/>
    <ellipse cx="118" cy="606" rx="26" ry="10" fill="#3a2a1a"/>
    <ellipse cx="210" cy="606" rx="26" ry="10" fill="#3a2a1a"/>
    <!-- body and dungarees -->
    <path d="M118 330 Q160 300 204 330 L214 480 L110 480 Z" fill="#e8c35a"/>
    <path d="M128 370 L196 370 L206 488 L120 488 Z" fill="#5b7fa8"/>
    <line x1="135" y1="372" x2="128" y2="330" stroke="#5b7fa8" stroke-width="8"/>
    <line x1="190" y1="372" x2="198" y2="330" stroke="#5b7fa8" stroke-width="8"/>
    <!-- back arm -->
    <path d="M128 345 Q100 400 120 440" stroke="#e8c35a" stroke-width="22" fill="none"/>
    <circle cx="122" cy="444" r="12" fill="#e8b98f"/>
    <!-- front arm holding the watering can -->
    <path d="M198 345 Q240 360 262 390" stroke="#e8c35a" stroke-width="22" fill="none"/>
    <circle cx="265" cy="394" r="12" fill="#e8b98f"/>
    <!-- head and sun hat -->
    <circle cx="162" cy="282" r="36" fill="#e8b98f"/>
    <circle cx="180" cy="284" r="3.5" fill="#202020"/>
    <path d="M174 300 Q184 308 192 298" stroke="#8a4b2d" stroke-width="3" fill="none"/>
    <ellipse cx="160" cy="254" rx="66" ry="12" fill="#d9b25e"/>
    <path d="M124 254 Q128 214 160 212 Q194 214 196 254 Z" fill="#e8c35a"/>
    <rect x="126" y="240" width="68" height="9" fill="#c0392b"/>
  </g>

  <!-- watering can -->
  <g transform="rotate(18 290 400)">
    <rect x="262" y="380" width="70" height="56" rx="8" fill="#4f9bd1" stroke="#2f6f9f" stroke-width="3"/>
    <path d="M270 382 Q297 350 324 382" fill="none" stroke="#2f6f9f" stroke-width="6"/>
    <path d="M330 400 L382 372 L388 382 L334 414 Z" fill="#4f9bd1" stroke="#2f6f9f" stroke-width="3"/>
    <rect x="380" y="364" width="14" height="24" rx="3" fill="#2f6f9f" transform="rotate(-28 387 376)"/>
  </g>
  <!-- water drops onto the soil -->
  <g fill="#6cb8e8">
    <path d="M402 432 q5 9 0 14 q-5 -5 0 -14 z"/>
    <path d="M416 452 q5 9 0 14 q-5 -5 0 -14 z"/>
    <path d="M396 470 q5 9 0 14 q-5 -5 0 -14 z"/>
    <path d="M412 488 q5 9 0 14 q-5 -5 0 -14 z"/>
  </g>
</svg>
